<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test API Gemini</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        #result { margin-top: 15px; padding: 15px; background: #f3f4f6; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; font-family: monospace; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Công cụ Kiểm tra API Key</h2>
    <button onclick="testAPI()">🚀 Bắn tín hiệu Test</button>
    <div id="result">Kết quả sẽ hiển thị ở đây...</div>

    <script>
        async function testAPI() {
            // Khóa API của bạn đã được dán sẵn
            const apiKey = "AQ.Ab8RN6Ih7K_JoHX3SHRrqaPwAYuA3D3xD2Ko22ZuJbl9QhS_vw";
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            document.getElementById('result').innerText = "Đang gửi yêu cầu đến Google...";

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Xin chào, hãy trả lời ngắn gọn: 1+1 bằng mấy?" }] }]
                    })
                });

                const data = await response.json();
                
                // Hiển thị trực tiếp phản hồi từ máy chủ Google
                if (!response.ok) {
                    document.getElementById('result').innerText = "❌ LỖI TỪ GOOGLE:\n" + JSON.stringify(data, null, 2);
                } else {
                    const answer = data.candidates[0].content.parts[0].text;
                    document.getElementById('result').innerText = "✅ THÀNH CÔNG! AI trả lời:\n" + answer;
                }
            } catch (error) {
                document.getElementById('result').innerText = "❌ Lỗi mạng hoặc kết nối:\n" + error.message;
            }
        }
    </script>
</body>
</html>
