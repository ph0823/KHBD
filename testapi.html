<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test API Gemini</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        #result { margin-top: 15px; padding: 15px; background: #f3f4f6; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; font-family: monospace; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Công cụ Kiểm tra API Key</h2>
    <button onclick="testAPI()">🚀 Bắn tín hiệu Test</button>
    <div id="result">Kết quả sẽ hiển thị ở đây...</div>

    <script>
        async function testAPI() {

            const apiKey = "AQ.Ab8RN6Ih7K_JoHX3SHRrqaPwAYuA3D3xD2Ko22ZuJbl9QhS_vw";

            const endpoint =
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent";

            document.getElementById("result").innerText =
                "Đang gửi yêu cầu đến Google...";

            try {

                const response = await fetch(endpoint, {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": apiKey
                    },

                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    {
                                        text: "Xin chào, hãy trả lời ngắn gọn: 1+1 bằng mấy?"
                                    }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();

                console.log("HTTP:", response.status);
                console.log("Google:", data);

                if (!response.ok) {

                    document.getElementById("result").innerText =
                        "❌ LỖI GOOGLE:\n\n" +
                        JSON.stringify(data, null, 2);

                    return;
                }

                const answer =
                    data.candidates?.[0]?.content?.parts?.[0]?.text;

                document.getElementById("result").innerText =
                    "✅ API HOẠT ĐỘNG!\n\n" +
                    "AI trả lời:\n" +
                    answer;

            } catch (error) {

                document.getElementById("result").innerText =
                    "❌ LỖI KẾT NỐI:\n\n" +
                    error.message;
            }
        }
        </script>
</body>
</html>
